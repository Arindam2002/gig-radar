# Labeled JD fixtures for the scoring ranking test.
# Labels: dream (must rank top), acceptable (middle), reject (must rank bottom).
# The ranking assertion is min(dream) > max(reject); two-extremes-only testing
# is banned (it's how rev-1's inversion stayed invisible).

